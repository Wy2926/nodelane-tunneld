# Merge this file into the existing OpenResty http configuration and replace
# the TLS path placeholders with the installed certificate paths.
# When a trusted CDN is in front of OpenResty, configure ngx_http_realip_module
# with that provider's current egress ranges. Never trust client-supplied IP
# headers from arbitrary source addresses.

server {
    listen 80;
    listen [::]:80;
    server_name tunnel.nodelane.net;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name *.tunnel.nodelane.net;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tunnel.nodelane.net;

    ssl_certificate     /REPLACE/WITH/fullchain.pem;
    ssl_certificate_key /REPLACE/WITH/privkey.pem;

    location ^~ /internal/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# This release supports HTTP tunnel routes only. Keep the wildcard entry on HTTP;
# the control site and OIDC callbacks must remain on HTTPS.
