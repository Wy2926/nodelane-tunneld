services:
  tunneld:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${TUNNELD_VERSION:-dev}
    restart: unless-stopped
    # Production target is Linux. Host networking preserves the loopback
    # trust boundary between Caddy/frps and tunneld.
    network_mode: host
    env_file:
      - ../.env
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
