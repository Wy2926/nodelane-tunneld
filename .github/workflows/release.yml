name: release

on:
  push:
    tags: ["nt-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
          - goos: windows
            goarch: arm64
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true

      - name: Verify client release version
        run: |
          version="${GITHUB_REF_NAME#nt-v}"
          pinned_version=$(tr -d '\r\n' < client-version.txt)
          if [ "$version" != "$pinned_version" ]; then
            echo "Client tag version $version does not match client-version.txt ($pinned_version)." >&2
            exit 1
          fi

      - name: Build nt
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p package
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          go build -trimpath -ldflags="-s -w -X github.com/Wy2926/nodelane-tunneld/internal/client.Version=${GITHUB_REF_NAME#nt-v}" -o "package/nt${suffix}" ./cmd/nt

      - name: Add frp license
        run: |
          frp_dir=$(go list -m -f '{{.Dir}}' github.com/fatedier/frp)
          cp "$frp_dir/LICENSE" package/LICENSE.frp
          if [ "${{ matrix.goos }}" != "windows" ]; then chmod 755 package/nt; fi
      - name: Package
        id: package
        run: |
          version="${GITHUB_REF_NAME#nt-v}"
          name="nt_${version}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd package && zip -q -r "../${name}" .)
          else
            tar -C package -czf "${name}" .
          fi
          sha256sum "${name}" > "${name}.sha256"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}
            ${{ steps.package.outputs.name }}.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
