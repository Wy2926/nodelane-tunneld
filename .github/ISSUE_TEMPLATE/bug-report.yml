name: Bug report
description: Report a reproducible problem with NodeLane Tunnel
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve NodeLane Tunnel. Do not include client tokens, tunnel credentials, administrator tokens, database URLs, or other secrets.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Installer or upgrade
        - nt command-line client
        - HTTP tunnel
        - TCP tunnel
        - UDP tunnel
        - Website
        - Self-hosted server
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, and the output of `nt version` when available.
      placeholder: Windows 11 x64, nt 0.4.2
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what you expected and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the shortest sequence of commands or actions that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Select ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Remove tokens, credentials, private hostnames, IP addresses, and other sensitive data before submitting.
      render: shell

  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive data check
      options:
        - label: I have removed secrets and sensitive data from this report.
          required: true
